services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DATASPEC_DB_NAME:-dataspec}
      POSTGRES_USER: ${DATASPEC_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DATASPEC_DB_PASSWORD:-postgres}
    ports:
      - "${DATASPEC_BIND_HOST:-127.0.0.1}:${DATASPEC_DB_PORT:-15432}:5432"
    volumes:
      - dataspec-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATASPEC_DB_USER:-postgres} -d ${DATASPEC_DB_NAME:-dataspec}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace/dataspec-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DATASPEC_DB_NAME:-dataspec}
      SPRING_DATASOURCE_USERNAME: ${DATASPEC_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DATASPEC_DB_PASSWORD:-postgres}
      SPRING_FLYWAY_ENABLED: "true"
      DATASPEC_SECURITY_ENABLED: ${DATASPEC_SECURITY_ENABLED:-false}
    ports:
      - "${DATASPEC_BIND_HOST:-127.0.0.1}:${DATASPEC_SERVER_PORT:-8090}:8090"
    volumes:
      - .:/workspace
      - dataspec-maven-cache:/root/.m2
    command: mvn spring-boot:run
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error http://localhost:8090/api-docs > /dev/null"
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      # Windows bind mount 首次编译可能超过 5 分钟；成功探测仍会立即结束宽限期。
      start_period: 6m

  web:
    image: node:22.23.1-bookworm
    working_dir: /workspace/dataspec-web
    depends_on:
      server:
        condition: service_healthy
    environment:
      VITE_PROXY_TARGET: http://server:8090
    ports:
      - "${DATASPEC_BIND_HOST:-127.0.0.1}:${DATASPEC_WEB_PORT:-5173}:5173"
    volumes:
      - .:/workspace
      - dataspec-pnpm-store:/pnpm/store
      - dataspec-web-node-modules:/workspace/dataspec-web/node_modules
    command: >
      sh -lc "corepack enable &&
      pnpm config set store-dir /pnpm/store &&
      pnpm install --frozen-lockfile &&
      exec node node_modules/vite/bin/vite.js --host 0.0.0.0 --port 5173"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error http://localhost:5173/ > /dev/null"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  dataspec-postgres-data:
  dataspec-maven-cache:
  dataspec-pnpm-store:
  dataspec-web-node-modules:
